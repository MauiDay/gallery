name: Update albums.json and generate thumbnails

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'thumbs/**'
      - 'medium/**'

jobs:
  update-albums:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate thumbnails and update albums.json
        run: |
          python3 -c "
          import json, os, glob, subprocess

          EXTENSIONS = {'.jpg', '.jpeg', '.png', '.webp'}
          SIZES = [
              ('thumbs', 600),
              ('medium', 1600),
          ]

          with open('albums.json') as f:
              albums = json.load(f)

          for album in albums:
              folder = album['id']
              if not os.path.isdir(folder):
                  album['images'] = []
                  continue

              images = sorted([
                  os.path.basename(p)
                  for p in glob.glob(os.path.join(folder, '*'))
                  if os.path.splitext(p)[1].lower() in EXTENSIONS
              ])
              album['images'] = images

              for size_dir, width in SIZES:
                  out_folder = os.path.join(size_dir, folder)
                  os.makedirs(out_folder, exist_ok=True)

                  for img in images:
                      src = os.path.join(folder, img)
                      dst = os.path.join(out_folder, img)
                      if os.path.exists(dst):
                          continue
                      try:
                          subprocess.run([
                              'convert', src,
                              '-resize', f'{width}x>',
                              '-quality', '80',
                              '-strip',
                              dst
                          ], check=True, capture_output=True)
                      except subprocess.CalledProcessError as e:
                          print(f'  Warning: failed to resize {src} to {width}px: {e.stderr.decode()}')

              print(f'  {folder}: {len(images)} images')

          with open('albums.json', 'w') as f:
              json.dump(albums, f, indent=2)
              f.write('\n')

          print(f'Updated {len(albums)} albums')
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add albums.json thumbs/ medium/
          git diff --staged --quiet && echo "No changes" || (git commit -m "Auto-update albums.json and generate thumbnails" && git push)
